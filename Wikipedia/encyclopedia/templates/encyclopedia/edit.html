{% extends "encyclopedia/layout.html" %}
{% load static %}

{% block title %}
    {{ title }}
{% endblock %}


{% block body %}
<h2>Edit Page: {{ title }}</h2>

<form action="{% url 'edit' title=title %}" method="post">
    {% csrf_token %}
    <textarea name="content" rows="20" cols="80">{{ content }}</textarea>
    <br><br>
    <button class="buttons" type="submit">Save</button>
</form>

{% endblock %}
