{% extends "encyclopedia/layout.html" %}

{% block title %}
    Search results
{% endblock %}

{% block body %}

    <h1>Search results for "{{ query }}"</h1>

{% if results %}
    <ol>
        {% for result in results %}    
            <li><a href="{% url 'file' title=result %}">{{ result }}</a></li>
        {% endfor %}
    </ol>

{% else %}
    <h1>404 Error!</h1>
{% endif %}

{% endblock %}
